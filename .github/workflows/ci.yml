name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - run: cargo fmt --all --check
      - run: cargo check --all-targets --locked
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      # Binary sanity (size matters — this service exists to save RAM).
      - run: ls -la target/release/gifthub-rust-ai && du -h target/release/gifthub-rust-ai
      # Clippy is informational, matching the reference repos' house style.
      - run: cargo clippy --all-targets --locked -- -A clippy::all || true
